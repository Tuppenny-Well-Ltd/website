<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d2420;
    --muted: #55605a;
    --accent: #1f6f5c;
    --rule: #d9d6cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121815;
      --fg: #eceee9;
      --muted: #a3ada6;
      --accent: #6fd0b4;
      --rule: #2c3631;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 1.125rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 4rem 1rem 2rem;
  }
  h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  .lead { color: var(--muted); }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer {
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 1rem 1rem 2rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.875rem;
  }
</style>
